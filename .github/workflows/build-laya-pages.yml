name: Review jade art V0.2 before publication

on:
  push:
    branches: [jade-art-v02]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Formal source commit or branch
        required: true
        default: 'cbc2b469d94e45070adbd27c87327b7cc7f97c64'

permissions:
  contents: read

concurrency:
  group: jade-art-review
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout preview deployment configuration
        uses: actions/checkout@v4
      - name: Checkout tested formal source
        uses: actions/checkout@v4
        with:
          repository: BaiMaGod/zhuanshouzhuo
          ref: ${{ inputs.source_ref || 'cbc2b469d94e45070adbd27c87327b7cc7f97c64' }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        working-directory: source
        run: npm install --no-audit --no-fund
      - name: Compile and run 24 rule, controller and material checks
        working-directory: source
        run: npm test
      - name: Install browser verification dependencies
        run: |
          npm install --prefix .qa --no-audit --no-fund playwright@1.62.1
          .qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify real Laya rendering, mouse and mobile touch
        run: |
          python3 -m http.server 8080 --directory source/dist > .qa/server.log 2>&1 &
          node .github/scripts/verify-game.cjs
      - name: Record release provenance and inspect publish payload
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,readdirSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const sourceSha=execFileSync('git',['-C','source','rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const version=JSON.parse(readFileSync('source/dist/version.json'));
          writeFileSync('source/dist/release.json',JSON.stringify({...version,sourceSha,previewSha:process.env.GITHUB_SHA,browserQA:'Chromium desktop pointer + mobile touch + ten levels passed'},null,2));
          function walk(dir){for(const f of readdirSync(dir,{withFileTypes:true})){const path=dir+'/'+f.name;if(f.isDirectory())walk(path);else if(/\.(ts|md)$/.test(f.name))throw Error('Source/document leaked into publish payload: '+path)}}
          walk('source/dist');
          JS
          touch source/dist/.nojekyll
      - name: Retain verified Web build
        uses: actions/upload-artifact@v4
        with:
          name: jade-verified-web-build
          path: source/dist
          retention-days: 7
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jade-browser-verification
          path: .qa/results
          if-no-files-found: ignore
          retention-days: 7
