name: Build, verify and deploy jade game
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Formal source commit
        required: true
        default: '27da0545ff10985b0090b601bed0e0ec32706c75'
env:
  JADE_SOURCE_SHA: '27da0545ff10985b0090b601bed0e0ec32706c75'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jade-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BaiMaGod/zhuanshouzhuo
          ref: ${{ inputs.source_ref || env.JADE_SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install, typecheck and run game regression checks
        working-directory: source
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Official LayaAir 3.4 Web build
        run: bash .github/scripts/build-official.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jade-candidate-web
          path: source/dist
          include-hidden-files: true
          retention-days: 7
  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile, narrow]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BaiMaGod/zhuanshouzhuo
          ref: ${{ inputs.source_ref || env.JADE_SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: jade-candidate-web
          path: source/dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser dependencies
        run: |
          npm install --prefix .qa --no-audit --no-fund playwright@1.62.1 pngjs@7.0.0
          .qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Real input, full formal route and teaching regression
        env:
          JADE_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --directory source/dist > .qa/server.log 2>&1 &
          mkdir -p .qa/results
          node .github/scripts/verify-production.cjs 2>&1 | tee .qa/results/browser-checks.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jade-browser-${{ matrix.profile }}
          path: .qa/results
          retention-days: 7
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jade-candidate-web
          path: source/dist
      - uses: actions/download-artifact@v4
        with:
          name: jade-browser-desktop
          path: .qa/desktop
      - uses: actions/download-artifact@v4
        with:
          name: jade-browser-mobile
          path: .qa/mobile
      - uses: actions/download-artifact@v4
        with:
          name: jade-browser-narrow
          path: .qa/narrow
      - name: Fail-closed evidence and payload verification
        run: node .github/scripts/accept-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: jade-verified-web-build
          path: source/dist
          include-hidden-files: true
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: jade-pages-${{ github.run_attempt }}
          path: source/dist
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: jade-pages-${{ github.run_attempt }}
          timeout: 1100000
  public-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile, narrow]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BaiMaGod/zhuanshouzhuo
          ref: ${{ inputs.source_ref || env.JADE_SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser dependencies
        run: |
          npm install --prefix .qa --no-audit --no-fund playwright@1.62.1 pngjs@7.0.0
          .qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify actual public release, zoom and touch rotation
        env:
          JADE_PROFILE: ${{ matrix.profile }}
          JADE_PUBLIC_SMOKE: 'true'
          JADE_URL: https://baimagod.github.io/zhuanshouzhuo-preview/
        run: |
          set -euo pipefail
          mkdir -p .qa/public-results
          node .github/scripts/verify-production.cjs 2>&1 | tee .qa/public-results/browser-checks.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jade-public-${{ matrix.profile }}
          path: .qa/public-results
          retention-days: 7
