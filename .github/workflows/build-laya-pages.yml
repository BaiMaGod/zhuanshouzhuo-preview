name: Build, verify and deploy jade game

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Formal source commit or branch
        required: true
        default: 'a558eafbc5a60e8037f622dd8d3e413d6ed31f76'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jade-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout preview deployment configuration
        uses: actions/checkout@v4
      - name: Checkout tested formal source
        uses: actions/checkout@v4
        with:
          repository: BaiMaGod/zhuanshouzhuo
          ref: ${{ inputs.source_ref || 'a558eafbc5a60e8037f622dd8d3e413d6ed31f76' }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        working-directory: source
        run: npm install --no-audit --no-fund
      - name: Compile and run 24 rule, controller and material checks
        working-directory: source
        run: |
          npm run typecheck
          npm test
      - name: Build official LayaAir 3.4 Web export and seal production payload
        run: bash .github/scripts/build-official.sh
      - name: Install browser verification dependencies
        run: |
          npm install --prefix .qa --no-audit --no-fund playwright@1.62.1 pngjs@7.0.0
          .qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify real Laya rendering, mouse and mobile touch
        run: |
          python3 -m http.server 8080 --directory source/dist > .qa/server.log 2>&1 &
          node .github/scripts/verify-production.cjs
      - name: Retain verified Web build
        uses: actions/upload-artifact@v4
        with:
          name: jade-verified-web-build
          path: source/dist
          retention-days: 7
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jade-browser-verification
          path: .qa/results
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game-only Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual public Pages release
        env:
          JADE_URL: https://baimagod.github.io/zhuanshouzhuo-preview/
        run: |
          mkdir -p .qa/local-verification
          cp -R .qa/results/. .qa/local-verification/
          node .github/scripts/verify-production.cjs
      - name: Retain public browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jade-public-verification-v02
          path: .qa/results
          retention-days: 7
