name: Dispatch peach logo preview deployment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-peach-logo-preview.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full verified preview deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/BaiMaGod/zhuanshouzhuo-preview/actions/workflows/build-laya-pages.yml/dispatches \
            -d '{"ref":"main","inputs":{"source_ref":"fc80e01c78cc641011edd65746e82fc96bc40903","release_mode":"full"}}'
